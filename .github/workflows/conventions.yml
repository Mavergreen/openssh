name: conventions

# The family conventions gate (concurrency declared, tests run, INGREDIENTS.md present, no
# Renovate key restating the preset, a release that publishes notes). Checks live in
# shipyard, so adding one never touches this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conventions:
    uses: Mavergreen/shipyard/.github/workflows/family-conventions.yml@v1
