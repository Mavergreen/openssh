name: conventions

# The family conventions gate (concurrency declared, tests run, INGREDIENTS.md present, no
# Renovate key restating the preset, a release that publishes notes). Checks live in
# shared-cmake, so adding one never touches this file.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conventions:
    uses: ModernMavericks/shared-cmake/.github/workflows/family-conventions.yml@v1
